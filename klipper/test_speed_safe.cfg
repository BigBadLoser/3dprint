# TEST_SPEED_SAFE: skipped-step test for printers with sensorless XY homing.
#
# Based on Andrew Ellis' TEST_SPEED, changed so that a bad sensorless home
# can't send the toolhead into the frame at full speed:
#   - homes X/Y only (Z once, if it isn't homed yet), then drives SLOWLY to
#     the bed centre and takes the reference position there, not at the frame
#   - one slow lap (50 mm/s) of the large pattern before any fast move:
#     if homing went wrong, the crash happens at walking pace and you see it
#     before the fast part starts (hit the emergency stop)
#   - larger default inset from the edges (BOUND=30)
#   - restores whatever speed/accel limits were active before, Kalico style
#
#   TEST_SPEED_SAFE SPEED=300 ACCEL=10000 ITERATIONS=5
#
# With the step_check plugin installed ([step_check], plugins/step_check.py)
# it prints the per-motor change and a PASS/FAIL line. Without it, compare
# the "mcu:" lines of the two GET_POSITION outputs: per motor, up to one full
# step (= microsteps, e.g. 32) is homing scatter, one 4-full-step cycle (128)
# can be sensorless homing scatter, two or more cycles is a lost-step fail.

[gcode_macro TEST_SPEED_SAFE]
description: Skipped-step test, safe for sensorless homing
gcode:
    {% set th = printer.toolhead %}
    {% set speed = params.SPEED|default(th.max_velocity)|int %}
    {% set accel = params.ACCEL|default(th.max_accel)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set mcr = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound = params.BOUND|default(30)|int %}
    {% set small = params.SMALLPATTERNSIZE|default(20)|int %}
    {% set z = params.Z|default(20)|float %}
    {% set slow = 50 * 60 %}

    {% set x_lo = [th.axis_minimum.x, 0]|max + bound %}
    {% set x_hi = th.axis_maximum.x - bound %}
    {% set y_lo = [th.axis_minimum.y, 0]|max + bound %}
    {% set y_hi = th.axis_maximum.y - bound %}
    {% set xc = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set yc = (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    {% set xs_lo = xc - small / 2 %}
    {% set xs_hi = xc + small / 2 %}
    {% set ys_lo = yc - small / 2 %}
    {% set ys_hi = yc + small / 2 %}

    { action_respond_info("TEST_SPEED_SAFE: %d iterations at %d mm/s, %d mm/s^2"
                          % (iterations, speed, accel)) }
    SAVE_GCODE_STATE NAME=TEST_SPEED_SAFE
    M400
    {% if "z" not in th.homed_axes %}
        G28
    {% else %}
        G28 X Y
    {% endif %}
    G90
    G1 Z{z} F600
    G1 X{xc} Y{yc} F{slow}
    M400
    G4 P500
    {% if "step_check" in printer %}
        STEP_CHECK_MARK
    {% else %}
        GET_POSITION
    {% endif %}

    # slow lap: watch it. Not at the expected spots or grinding -> E-STOP
    G1 X{x_lo} Y{y_lo} F{slow}
    G1 X{x_hi} Y{y_lo} F{slow}
    G1 X{x_hi} Y{y_hi} F{slow}
    G1 X{x_lo} Y{y_hi} F{slow}
    G1 X{x_lo} Y{y_lo} F{slow}
    M400

    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={mcr}
    {% set f = speed * 60 %}
    {% for i in range(iterations) %}
        G1 X{x_lo} Y{y_lo} F{f}
        G1 X{x_hi} Y{y_hi} F{f}
        G1 X{x_lo} Y{y_lo} F{f}
        G1 X{x_hi} Y{y_lo} F{f}
        G1 X{x_lo} Y{y_hi} F{f}
        G1 X{x_hi} Y{y_lo} F{f}
        G1 X{x_lo} Y{y_lo} F{f}
        G1 X{x_lo} Y{y_hi} F{f}
        G1 X{x_hi} Y{y_hi} F{f}
        G1 X{x_hi} Y{y_lo} F{f}
        G1 X{xs_lo} Y{ys_lo} F{f}
        G1 X{xs_hi} Y{ys_hi} F{f}
        G1 X{xs_lo} Y{ys_lo} F{f}
        G1 X{xs_hi} Y{ys_lo} F{f}
        G1 X{xs_lo} Y{ys_hi} F{f}
        G1 X{xs_hi} Y{ys_lo} F{f}
        G1 X{xs_lo} Y{ys_lo} F{f}
        G1 X{xs_lo} Y{ys_hi} F{f}
        G1 X{xs_hi} Y{ys_hi} F{f}
        G1 X{xs_hi} Y{ys_lo} F{f}
    {% endfor %}
    SET_VELOCITY_LIMIT VELOCITY={th.max_velocity} ACCEL={th.max_accel} MINIMUM_CRUISE_RATIO={th.minimum_cruise_ratio}

    # slow back to the centre, re-home, and measure at the same spot
    G1 X{xc} Y{yc} F{slow}
    M400
    G28 X Y
    G90
    G1 X{xc} Y{yc} F{slow}
    M400
    G4 P500
    {% if "step_check" in printer %}
        STEP_CHECK_REPORT
    {% else %}
        GET_POSITION
    {% endif %}
    RESTORE_GCODE_STATE NAME=TEST_SPEED_SAFE
